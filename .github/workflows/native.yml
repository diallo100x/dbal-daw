name: DBAL native Mac and iPad checks
on:
  push:
    paths: ['native/**', '.github/workflows/native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: DSP, project and edit logic regression tests
        working-directory: native/DBALPocketStudio
        run: |
          ./Scripts/test.sh
          ./Scripts/test_midi_edits.sh
          ./Scripts/test_apple_audio.sh
          ./Scripts/test_graph_guard.sh
          ./Scripts/test_plugin_discovery.sh
      - name: Build native Mac DAW
        run: |
          set -o pipefail
          xcodebuild -project native/DBALPocketStudio/DBALPocketStudio.xcodeproj -scheme DBALNativeMac -configuration Release -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/DBALMac" CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/dbal-mac.log"
      - name: Build iPad Legacy compatibility target
        run: |
          set -o pipefail
          xcodebuild -project native/DBALPocketStudio/DBALPocketStudio.xcodeproj -scheme PocketLegacy -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/DBALiPad" CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/dbal-ipad.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DBAL-native-build-logs
          path: |
            ${{ runner.temp }}/dbal-mac.log
            ${{ runner.temp }}/dbal-ipad.log
